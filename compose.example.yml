name: runnel-dashboard
services:
  runnel:
    image: ${RUNNEL_IMAGE:-ghcr.io/kinoforge/runnel:0.0.3-beta.2}
    environment:
      RUNNEL_ADMIN_TOKEN: ${RUNNEL_ADMIN_TOKEN:?set RUNNEL_ADMIN_TOKEN}
      RUNNEL_STORE: hybrid:/data
    tmpfs:
      - /data:uid=65532,gid=65532
    ports: ["127.0.0.1:8700:8700"]
  dashboard:
    build: .
    environment:
      RUNNEL_LOCAL_URL: http://admin:${RUNNEL_ADMIN_TOKEN:?set RUNNEL_ADMIN_TOKEN}@runnel:8700
    volumes:
      - ./dashboard.local.yaml:/etc/runnel-dashboard/dashboard.yaml:ro
    ports: ["127.0.0.1:8710:8710"]
    depends_on: [runnel]
